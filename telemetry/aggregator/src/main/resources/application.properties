# Настройки подключения к Kafka
aggregator.kafka.bootstrap-servers=localhost:9092
aggregator.kafka.consumer.group-id=aggregator-group
aggregator.kafka.consumer.auto-offset-reset=earliest
aggregator.kafka.consumer.enable-auto-commit=false
aggregator.kafka.consumer.poll-timeout-ms=100

# Сериализаторы и десериализаторы
aggregator.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
aggregator.kafka.consumer.value-deserializer=ru.yandex.practicum.serializer.SensorEventDeserializer
aggregator.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
aggregator.kafka.producer.value-serializer=ru.yandex.practicum.serializer.GeneralAvroSerializer

# Названия топиков
aggregator.kafka.topics.sensors=telemetry.sensors.v1
aggregator.kafka.topics.snapshots=telemetry.snapshots.v1
