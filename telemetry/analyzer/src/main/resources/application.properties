# Настройки PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/telemetry_analyzer
spring.datasource.username=dbuser
spring.datasource.password=12345
spring.datasource.driver-class-name=org.postgresql.Driver

# Инициализация schema.sql при старте приложения
spring.sql.init.mode=always
spring.sql.init.separator=;;
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Настройки gRPC-клиента для отправки команд в Hub Router
grpc.client.hub-router.address=static://localhost:59090
grpc.client.hub-router.enableKeepAlive=true
grpc.client.hub-router.keepAliveWithoutCalls=true
grpc.client.hub-router.negotiationType=plaintext

# Общие настройки Kafka
analyzer.kafka.bootstrap-servers=localhost:9092

# Консьюмер для снапшотов (telemetry.snapshots.v1)
analyzer.kafka.snapshot-consumer.group-id=analyzer-snapshot-group
analyzer.kafka.snapshot-consumer.auto-offset-reset=earliest
analyzer.kafka.snapshot-consumer.enable-auto-commit=false
analyzer.kafka.snapshot-consumer.poll-timeout-ms=100
analyzer.kafka.snapshot-consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
analyzer.kafka.snapshot-consumer.value-deserializer=ru.yandex.practicum.serializer.SensorsSnapshotDeserializer
analyzer.kafka.snapshot-consumer.topic=telemetry.snapshots.v1

# Консьюмер для событий хабов (telemetry.hubs.v1)
analyzer.kafka.hub-consumer.group-id=analyzer-hub-group
analyzer.kafka.hub-consumer.auto-offset-reset=earliest
analyzer.kafka.hub-consumer.enable-auto-commit=false
analyzer.kafka.hub-consumer.poll-timeout-ms=100
analyzer.kafka.hub-consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
analyzer.kafka.hub-consumer.value-deserializer=ru.yandex.practicum.serializer.HubEventDeserializer
analyzer.kafka.hub-consumer.topic=telemetry.hubs.v1
